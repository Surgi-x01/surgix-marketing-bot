services:
  - type: web
    name: surgix-marketing-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_MODE
        value: polling
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BUFFER_ACCESS_TOKEN
        sync: false
      - key: FIGMA_API_TOKEN
        sync: false
